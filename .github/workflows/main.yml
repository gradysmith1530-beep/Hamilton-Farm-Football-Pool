name: Update standings 
 
on:
  schedule:
    - cron: "0 4 * * *"    # 12am ET — catches Saturday college games
    - cron: "0 11 * * *"   # 7am ET — catches Sunday and Monday NFL games
  workflow_dispatch:        # the "Run workflow" button
 
permissions:
  contents: write
 
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
 
      - name: Read the scores
        run: python update.py
 
      - name: Publish the new standings
        run: |
          git config user.name "HF Football bot"
          git config user.email "actions@users.noreply.github.com"
          git add standings.json
          git diff --staged --quiet || git commit -m "Standings for $(date -u +%Y-%m-%d)"
          git push
 
